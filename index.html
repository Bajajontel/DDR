<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="DDR - Danendra DeadLine Radar: pengingat tugas dan jadwal kuliah.">
<title>DDR - Danendra DeadLine Radar</title>
<style>*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6fb;--card:#ffffff;--ink:#16162a;--mute:#6b6b82;--line:#e6e6f0;
  --ac:#4f46e5;--acbg:#eceafd;--acink:#ffffff;
  --red:#c0262d;--redbg:#fde8e8;--yel:#9a5b00;--yelbg:#fff1d6;--grn:#1d7a3f;--grnbg:#e2f5e8;--pink:#c2255c;--pinkbg:#fde7ef;
  --shadow:0 1px 2px rgba(22,22,42,.06),0 4px 14px rgba(22,22,42,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0f1a;--card:#1a1a2b;--ink:#ececf6;--mute:#9a9ab3;--line:#2a2a40;
  --ac:#8b84ff;--acbg:#26244d;--acink:#10102a;
  --red:#ff8a8f;--redbg:#3b1c20;--yel:#f2b45a;--yelbg:#392a10;--grn:#6fdc93;--grnbg:#14301f;--pink:#ff8fb6;--pinkbg:#3a1a27;--shadow:none;}}
:root[data-theme="dark"]{
  --bg:#0f0f1a;--card:#1a1a2b;--ink:#ececf6;--mute:#9a9ab3;--line:#2a2a40;
  --ac:#8b84ff;--acbg:#26244d;--acink:#10102a;
  --red:#ff8a8f;--redbg:#3b1c20;--yel:#f2b45a;--yelbg:#392a10;--grn:#6fdc93;--grnbg:#14301f;--pink:#ff8fb6;--pinkbg:#3a1a27;--shadow:none;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand b{font-size:20px;letter-spacing:.5px}
.brand small{display:block;color:var(--mute);font-size:11px;line-height:1.2}
.logo{width:36px;height:36px;border-radius:10px;background:var(--ac);display:grid;place-items:center;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nb{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;background:none;border-radius:10px;text-align:left;color:var(--mute);font-weight:500;width:100%}
.nb:hover{background:var(--bg)}
.nb.on{background:var(--acbg);color:var(--ac);font-weight:600}
.nb svg{width:20px;height:20px;flex:none}
.sp{flex:1}
.main{padding:28px 32px 40px;max-width:980px;width:100%}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:24px;margin:0;line-height:1.2}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--mute);margin-top:2px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.dng{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.p-red{background:var(--redbg);color:var(--red)}.p-yel{background:var(--yelbg);color:var(--yel)}.p-grn{background:var(--grnbg);color:var(--grn)}.p-ac{background:var(--acbg);color:var(--ac)}.p-pink{background:var(--pinkbg);color:var(--pink)}
.radar{display:grid;place-items:center;padding:6px 0}
.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);border-left:4px solid var(--line)}
.task.red{border-left-color:var(--red)}.task.yel{border-left-color:var(--yel)}.task.grn{border-left-color:var(--grn)}
.task.done{opacity:.55}.task.done .tt{text-decoration:line-through}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--mute);background:none;flex:none;margin-top:1px;display:grid;place-items:center;padding:0}
.chk.on{background:var(--grn);border-color:var(--grn);color:#fff}
.tb{flex:1;min-width:0;cursor:pointer}
.tt{font-weight:600}
.tm{color:var(--mute);font-size:13px;margin-top:2px}
.now{display:flex;gap:12px;align-items:center;border-radius:14px;padding:12px 14px;background:var(--acbg);color:var(--ac);margin-bottom:14px}
.now b{color:var(--ink)}
.empty{text-align:center;padding:28px 12px;color:var(--mute)}
.empty .btn{margin:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:12px;color:var(--mute);text-align:center;padding:4px 0;font-weight:600}
.cd{aspect-ratio:1/1;border:1px solid transparent;background:none;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:500}
.cd:hover{background:var(--bg)}
.cd.td{border-color:var(--ac)}
.cd.sel{background:var(--ac);color:var(--acink)}
.cd.mut{opacity:.35}
.dots{display:flex;gap:2px;height:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--red)}
.dots i.c{background:var(--ac)}
.cd.sel .dots i{background:var(--acink)}
.mk{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.mk .sw{width:8px;align-self:stretch;border-radius:4px;background:var(--ac)}
.mk .sw.pr{background:var(--pink)}
.mk.cur{border-color:var(--ac);background:var(--acbg)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--ac);border-color:var(--ac);color:var(--acink)}
.timer{font-size:72px;font-weight:700;text-align:center;letter-spacing:2px;font-variant-numeric:tabular-nums;margin:6px 0}
.ring{display:grid;place-items:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.c{justify-content:center}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
input[type=text],input[type=datetime-local],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.err{color:var(--red);font-size:13px;margin-top:4px;min-height:1em}
.ov{position:fixed;inset:0;background:rgba(10,10,25,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.show{display:flex}
.mod{background:var(--card);border-radius:18px;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:20px;border:1px solid var(--line)}
.sub-i{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.sub-i:last-child{border:0}
.sub-i span{flex:1}.sub-i.d span{text-decoration:line-through;color:var(--mute)}
.x{border:0;background:none;color:var(--mute);font-size:18px;padding:0 4px}
.rem{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tg{width:42px;height:24px;border-radius:999px;background:var(--line);border:0;position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--ac)}.tg.on::after{left:21px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;display:none;max-width:90vw}
.bnav{display:none}
.mtop,.fab{display:none}
@media (max-width:760px){
  .app{display:block}
  .side{display:none}
  .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
  .mtop b{font-size:18px;letter-spacing:.5px;line-height:1.1}
  .mtop small{display:block;color:var(--mute);font-size:11px;line-height:1.1}
  .mtop .logo{width:32px;height:32px;border-radius:9px}
  .main{padding:16px 16px 150px}
  .top .btn.pri{display:none}
  .top{margin-bottom:14px}
  .grid2,.grid2[style]{grid-template-columns:1fr!important}
  h1{font-size:21px}
  .card{padding:14px;border-radius:14px}
  .radar svg{width:min(240px,70vw);height:auto}
  .task{padding:12px 10px}
  .chk{width:26px;height:26px}
  .btn{min-height:44px}.btn.sm{min-height:36px}
  input[type=text],input[type=datetime-local],select,textarea{font-size:16px;min-height:44px}
  .cd{border-radius:8px}
  .timer{font-size:58px}
  .seg{overflow-x:auto;flex-wrap:nowrap;margin-right:-16px;padding-right:16px}
  .seg button{white-space:nowrap;min-height:36px}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:var(--acink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(79,70,229,.4);z-index:45}
  .toast{bottom:calc(144px + env(safe-area-inset-bottom))}
  .ov{align-items:flex-end;padding:0}
  .mod{max-width:none;border-radius:20px 20px 0 0;max-height:90vh;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
  .mod::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}
  .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--mute);padding:4px 0;min-height:48px}
  .bnav button.on{color:var(--ac)}
  .bnav svg{width:22px;height:22px}
  .morel{display:flex;align-items:center;gap:12px;width:100%;padding:14px 8px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-weight:600}
  .morel svg{width:22px;height:22px;color:var(--ac)}
}
</style>

<div class="app">
  <aside class="side" id="side"></aside>
  <div><div class="mtop"><div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12L18 6"/></svg></div><div><b>DDR</b><small>Danendra DeadLine Radar</small></div></div><main class="main" id="main"></main></div>
</div>
<button class="fab" data-add aria-label="Tambah tugas">+</button>
<nav class="bnav" id="bnav"></nav>
<div class="ov" id="ov"><div class="mod" id="mod"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
// ---- Data KRS (9 matkul, 24 SKS). Hari: 1=Senin ... 5=Jumat
var MK=[
 {n:"Pengantar Analisis Data",d:1,s:"12.50",e:"15.20",r:"LK 2.2",k:3,p:0},
 {n:"Pemrograman Web",d:1,s:"15.30",e:"17.10",r:"G.3.3",k:2,p:0},
 {n:"Basis Data",d:2,s:"09.40",e:"12.10",r:"E.1.1",k:3,p:0},
 {n:"Sistem Operasi",d:2,s:"12.50",e:"15.20",r:"E.1.1",k:3,p:0},
 {n:"PBO Praktik",d:3,s:"08.50",e:"12.10",r:"LK 2.2",k:2,p:1},
 {n:"Kecerdasan Buatan",d:3,s:"12.50",e:"15.20",r:"E.1.1",k:3,p:0},
 {n:"Mobile & Web Service (RPL)",d:4,s:"07.00",e:"09.30",r:"E.1.1",k:3,p:0},
 {n:"Pengembangan Aplikasi Mobile (RPL)",d:4,s:"12.50",e:"15.20",r:"E.1.1",k:3,p:0},
 {n:"Pemrograman Web Praktik",d:5,s:"12.50",e:"16.20",r:"LK 2.2",k:2,p:1}
];
var HARI=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
var BULAN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var ICON={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>',
 tugas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',
 kal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>',
 mk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 016.5 3H20v16H6.5A2.5 2.5 0 004 21.5z"/><path d="M4 18.5V5.5"/></svg>',
 bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 1112 0v5l1.5 2h-15z"/><path d="M10 21h4"/></svg>',
 fokus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>',
 user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>'
};
var VIEWS=[["home","Beranda","home"],["tugas","Tugas","tugas"],["kal","Kalender","kal"],["mk","Matkul","mk"],["bell","Pengingat","bell"],["fokus","Fokus","fokus"],["user","Profil","user"]];

// ---- State
var S={tasks:[],name:"",theme:"auto",notif:{h3:true,h1:true,j3:true},ex:false};
var view="home",calY,calM,calSel,filter="aktif",fSel=null,focus={t:1500,run:false,iv:null,done:0};
var db=null,docRef=null,saving=false,pending=false,LS="ddr-web-v1";
var $=function(i){return document.getElementById(i)};
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
function uid(){return "t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function pad(n){return (n<10?"0":"")+n}
function toLocalInput(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){return new Date(s)}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},2200)}

// ---- Persistence (db private per viewer, fallback localStorage)
function snapshot(){return {tasks:S.tasks,name:S.name,theme:S.theme,notif:S.notif,ex:S.ex}}
function apply(o){if(!o||typeof o!=="object")return;
  if(Array.isArray(o.tasks))S.tasks=o.tasks;
  if(typeof o.name==="string")S.name=o.name;
  if(o.theme)S.theme=o.theme;
  if(o.notif)S.notif=Object.assign({h3:true,h1:true,j3:true},o.notif);
  S.ex=!!o.ex}
function lsGet(){try{var r=localStorage.getItem(LS);return r?JSON.parse(r):null}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LS,JSON.stringify(snapshot()))}catch(e){}}
function save(){
  lsSet();
  if(!docRef)return;
  if(saving){pending=true;return}
  saving=true;
  docRef.set(snapshot()).then(function(){saving=false;if(pending){pending=false;save()}},function(){saving=false;pending=false});
}
async function init(){
  var l=lsGet();if(l)apply(l);
  themeApply();render();
  try{
    var c=window.claude&&await window.claude.use("db");
    var u=window.claude&&await window.claude.use("user");
    var id=u&&await u.id();
    if(c&&id){
      db=c;docRef=db.doc("data/users/"+id+"/profile");
      var snap=await docRef.get();
      if(snap.exists){apply(snap.data());lsSet()}
      else if(l){docRef.set(snapshot()).catch(function(){})}
      themeApply();render();
    }
  }catch(e){docRef=null}
}

// ---- Time helpers
function now(){return new Date()}
function urg(t){
  if(t.done)return "grn";
  var ms=parse(t.due)-now();
  if(ms<24*36e5)return "red";       // <24 jam atau terlewat
  if(ms<7*864e5)return "yel";       // minggu ini
  return "grn";
}
function rel(t){
  var ms=parse(t.due)-now(),a=Math.abs(ms),m=Math.round(a/6e4),h=Math.round(a/36e5),d=Math.round(a/864e5);
  var s=m<60?m+" menit":h<48?h+" jam":d+" hari";
  return ms<0?"terlambat "+s:s+" lagi"}
function fmtDue(t){var d=parse(t.due);return HARI[d.getDay()]+", "+d.getDate()+" "+BULAN[d.getMonth()].slice(0,3)+" · "+pad(d.getHours())+"."+pad(d.getMinutes())}
function tmin(s){var p=s.split(".");return +p[0]*60+ +p[1]}
function curClass(){var n=now(),m=n.getHours()*60+n.getMinutes(),d=n.getDay();
  for(var i=0;i<MK.length;i++){if(MK[i].d===d&&m>=tmin(MK[i].s)&&m<tmin(MK[i].e))return {c:MK[i],now:true}}
  var best=null,bd=1e9;
  for(i=0;i<MK.length;i++){var diff=((MK[i].d-d+7)%7)*1440+tmin(MK[i].s)-m;if(diff<=0)diff+=7*1440;if(diff<bd){bd=diff;best=MK[i]}}
  return {c:best,now:false,in:bd}}
function mkName(t){return t.mk>=0&&MK[t.mk]?MK[t.mk].n:"Umum"}
function sorted(a){return a.slice().sort(function(x,y){return parse(x.due)-parse(y.due)})}
function prog(t){if(!t.subs||!t.subs.length)return t.done?100:0;return Math.round(t.subs.filter(function(s){return s.d}).length/t.subs.length*100)}

// ---- Render
function themeApply(){var r=document.documentElement;if(S.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.theme)}
function pill(u){return '<span class="pill p-'+u+'">'+(u==="red"?"Mendesak":u==="yel"?"Minggu ini":"Aman")+'</span>'}
function navHtml(){return VIEWS.map(function(v){return '<button class="nb'+(view===v[0]?" on":"")+'" data-go="'+v[0]+'">'+ICON[v[2]]+'<span>'+v[1]+'</span></button>'}).join("")}
function shell(){
  $("side").innerHTML='<div class="brand"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12L18 6"/></svg></div><div><b>DDR</b><small>Danendra DeadLine Radar</small></div></div><div class="nav">'+navHtml()+'</div><div class="sp"></div><button class="btn pri" data-add>+ Tambah tugas</button>';
  var mo=["mk","bell","fokus","user"].indexOf(view)>=0;

  S.tasks.forEach(function(t){if(t.done)return;var due=parse(t.due);
    [["h3",3*864e5,"H-3"],["h1",864e5,"H-1"],["j3",3*36e5,"3 jam"]].forEach(function(r){
      var at=due-r[1],k=t.id+r[0]+t.due,n=Date.now();

// ---- Events
var armed=null;
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-go],[data-more],[data-add],[data-tog],[data-open],[data-f],[data-day],[data-cm],[data-nt],[data-perm],[data-fr],[data-fx],[data-th],[data-ex],[data-clr],[data-close],[data-sv],[data-st],[data-sd],[data-sa],[data-del],[data-edit],[data-ff]");

  else if(d.more!==undefined){openMod(["bell","fokus","user"].map(function(k){var v=VIEWS.filter(function(x){return x[0]===k})[0];return '<button class="morel" data-go="'+k+'">'+ICON[v[2]]+v[1]+'</button>'}).join(""))}

  else if(d.cm){calM+=+d.cm;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}calSel=ymd(new Date(calY,calM,1));render()}
  else if(d.nt){S.notif[d.nt]=!S.notif[d.nt];save();render()}
  else if(d.perm!==undefined){try{Notification.requestPermission().then(render)}catch(x){}}

  else if(d.fx!==undefined){fStop();focus.t=1500;render()}

  else if(d.close!==undefined)closeMod();
  else if(d.sv!==undefined)saveTask(d.sv);
  else if(d.st){var p=d.st.split(":"),tk=S.tasks.find(function(x){return x.id===p[0]});tk.subs[+p[1]].d=!tk.subs[+p[1]].d;save();detail(p[0]);render()}
  else if(d.sd){var q=d.sd.split(":"),tq=S.tasks.find(function(x){return x.id===q[0]});tq.subs.splice(+q[1],1);save();detail(q[0]);render()}
  else if(d.sa){var v=$("f-s").value.trim();if(!v)return;var ta=S.tasks.find(function(x){return x.id===d.sa});ta.subs=ta.subs||[];ta.subs.push({t:v,d:false});save();detail(d.sa);render()}
  else if(d.del){if(armed!==el){armed=el;el.textContent="Klik lagi untuk hapus";setTimeout(function(){armed=null;if(el.isConnected)el.textContent="Hapus"},3000)}else{S.tasks=S.tasks.filter(function(x){return x.id!==d.del});armed=null;save();closeMod();render();toast("Tugas dihapus")}}
  else if(d.edit)taskForm(S.tasks.find(function(x){return x.id===d.edit}));
  else if(d.ff){fSel=d.ff;closeMod();go("fokus")}
});
document.addEventListener("input",function(e){
  if(e.target.id==="pname"){S.name=e.target.value.trim();clearTimeout(input.h);input.h=setTimeout(save,600)}
  if(e.target.id==="fsel")fSel=e.target.value||null});
function input(){}
document.addEventListener("keydown",function(e){
  if(e.key==="Escape")closeMod();
  if(e.key==="Enter"&&e.target.id==="f-s"){var b=document.querySelector("[data-sa]");if(b)b.click()}
  if(e.key==="Enter"&&(e.target.id==="f-t")){var s=document.querySelector("[data-sv]");if(s)s.click()}});
init();
})();
</script>
</body>
</html>
